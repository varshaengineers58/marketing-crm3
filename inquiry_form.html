{% extends 'base.html' %}{% block content %}<section class="panel form"><h1>New Customer Inquiry</h1><form method="post"><label>Customer<select name="customer_id" required>{% for c in customers %}<option value="{{c.id}}">{{c.company}}</option>{% endfor %}</select></label><label>Inquiry / Requirement<input name="title" required></label><label>Estimated value (INR)<input type="number" step="0.01" name="value"></label><label>Inquiry date<input type="date" name="inquiry_date" value="{{today}}"></label><label>Next follow-up<input type="date" name="next_followup"></label><label>Notes<textarea name="notes"></textarea></label><button>Create Inquiry</button></form></section>{% endblock %}
