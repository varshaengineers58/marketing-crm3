{% extends 'base.html' %}{% block content %}<section class="panel form"><h1>Owner Settings</h1><p>Configure company details and the daily summary recipient. Email delivery also requires SMTP settings in <code>.env</code>.</p><form method="post"><label>Company name<input name="company_name" value="{{settings.company_name}}"></label><label>Company address<input name="company_address" value="{{settings.company_address}}"></label><label>Company / owner email<input type="email" name="company_email" value="{{settings.company_email}}"></label><label>Currency<input name="currency" value="{{settings.currency}}"></label><label>Daily summary time<input type="time" name="daily_summary_time" value="{{settings.daily_summary_time}}"></label><button>Save Settings</button></form></section>{% endblock %}
