{% extends 'base.html' %}{% block content %}<div class="top"><h1>Customers</h1><a class="button" href="/customers/new">+ Customer</a></div><form class="search"><input name="q" value="{{q}}" placeholder="Search company, contact or email"><button>Search</button></form><section class="panel"><table><tr><th>Company</th><th>Contact</th><th>Email</th><th>Phone</th><th>City</th></tr>{% for c in customers %}<tr><td>{{c.company}}</td><td>{{c.contact_name or '—'}}</td><td>{{c.email or '—'}}</td><td>{{c.phone or '—'}}</td><td>{{c.city or '—'}}</td></tr>{% endfor %}</table></section>{% endblock %}
