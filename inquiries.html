{% extends 'base.html' %}{% block content %}<div class="top"><h1>Inquiries</h1><a class="button" href="/inquiries/new">+ New Inquiry</a></div><form class="search"><input name="q" value="{{q}}" placeholder="Search customer, inquiry or PO"><select name="status"><option value="">All stages</option>{% for s in statuses %}<option value="{{s}}" {% if selected==s %}selected{% endif %}>{{s}}</option>{% endfor %}</select><button>Filter</button></form><section class="panel"><table><tr><th>Customer</th><th>Inquiry</th><th>Value</th><th>Status</th><th>Follow-up</th><th>Owner</th></tr>{% for i in inquiries %}<tr><td><a href="/inquiries/{{i.id}}">{{i.company}}</a></td><td>{{i.title}}</td><td>₹ {{'%.2f'|format(i.value)}}</td><td><span class="pill">{{i.status}}</span></td><td>{{i.next_followup or '—'}}</td><td>{{i.username}}</td></tr>{% endfor %}</table></section>{% endblock %}
